name: Scheduled jobs
# เรียกงานตามเวลาของ Studio ทุก 5 นาที (ส่ง LINE/อีเมลซ้ำ · ปล่อยคิวที่ไม่ยืนยัน · เตือนนัด · ตรวจโดเมน · Ops/Dev Agent)
# ใช้แทน Vercel Cron ซึ่งแผน Hobby ตั้งได้วันละครั้ง · ต้องตั้ง repository secrets: STUDIO_URL และ CRON_SECRET
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run due jobs
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$STUDIO_URL" ] || [ -z "$CRON_SECRET" ]; then echo "ยังไม่ได้ตั้ง secrets STUDIO_URL / CRON_SECRET · ข้าม"; exit 0; fi
          curl --fail-with-body -sS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "${STUDIO_URL%/}/api/cron/all"
